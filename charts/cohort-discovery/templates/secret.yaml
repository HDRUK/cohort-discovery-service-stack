{{- $missing := "is not set. Run scripts/local-secrets.sh and pass -f generated/secrets.values.yaml" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cohort-discovery.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cohort-discovery.labels" (dict "root" . "component" "secrets") | nindent 4 }}
type: Opaque
stringData:
  app-key: {{ required (printf "secrets.appKey %s" $missing) .Values.secrets.appKey | quote }}
  mysql-root-password: {{ required (printf "secrets.mysqlRootPassword %s" $missing) .Values.secrets.mysqlRootPassword | quote }}
  mysql-password: {{ required (printf "secrets.mysqlPassword %s" $missing) .Values.secrets.mysqlPassword | quote }}
  jwt-secret: {{ required (printf "secrets.jwtSecret %s" $missing) .Values.secrets.jwtSecret | quote }}
  collection-hosts-key-salt-1: {{ required (printf "secrets.collectionHostsKeySalt1 %s" $missing) .Values.secrets.collectionHostsKeySalt1 | quote }}
  collection-hosts-key-salt-2: {{ required (printf "secrets.collectionHostsKeySalt2 %s" $missing) .Values.secrets.collectionHostsKeySalt2 | quote }}
  admin-password: {{ required (printf "secrets.adminPassword %s" $missing) .Values.secrets.adminPassword | quote }}
  scheduler-client-id: {{ required (printf "secrets.schedulerClientId %s" $missing) .Values.secrets.schedulerClientId | quote }}
  scheduler-client-secret: {{ required (printf "secrets.schedulerClientSecret %s" $missing) .Values.secrets.schedulerClientSecret | quote }}
  passport-private-key: {{ required (printf "secrets.passportPrivateKey %s" $missing) .Values.secrets.passportPrivateKey | quote }}
  passport-public-key: {{ required (printf "secrets.passportPublicKey %s" $missing) .Values.secrets.passportPublicKey | quote }}
  {{- if .Values.keycloak.enabled }}
  keycloak-admin-password: {{ required (printf "secrets.keycloakAdminPassword %s" $missing) .Values.secrets.keycloakAdminPassword | quote }}
  keycloak-client-secret: {{ required (printf "secrets.keycloakClientSecret %s" $missing) .Values.secrets.keycloakClientSecret | quote }}
  {{- range include "cohort-discovery.keycloakPasswordKeys" . | fromJsonArray }}
  {{ include "cohort-discovery.keycloakPasswordSecretKey" . }}: {{ required (printf "secrets.%s, the passwordKey of a keycloak.users entry, is not set. Run scripts/local-secrets.sh for the default users, or add it to generated/secrets.values.yaml, and pass -f generated/secrets.values.yaml" .) (index $.Values.secrets .) | quote }}
  {{- end }}
  {{- end }}
  {{- if include "cohort-discovery.syntheticCollections" . | fromJsonArray }}
  synthetic-db-password: {{ required (printf "secrets.syntheticDbPassword %s" $missing) .Values.secrets.syntheticDbPassword | quote }}
  {{- end }}
