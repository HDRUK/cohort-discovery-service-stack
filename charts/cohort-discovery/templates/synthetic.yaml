{{- $collections := include "cohort-discovery.syntheticCollections" . | fromJsonArray -}}
{{- if $collections }}
{{- $root := . -}}
{{- $db := include "cohort-discovery.name" (dict "root" . "component" "synthetic-db") -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $db }}-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cohort-discovery.labels" (dict "root" . "component" "synthetic-db") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    tilt.dev/down-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.synthetic.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.synthetic.storageSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $db }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cohort-discovery.labels" (dict "root" . "component" "synthetic-db") | nindent 4 }}
spec:
  selector:
    {{- include "cohort-discovery.selectorLabels" (dict "root" . "component" "synthetic-db") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $db }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cohort-discovery.labels" (dict "root" . "component" "synthetic-db") | nindent 4 }}
spec:
  serviceName: {{ $db }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "cohort-discovery.selectorLabels" (dict "root" . "component" "synthetic-db") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cohort-discovery.labels" (dict "root" . "component" "synthetic-db") | nindent 8 }}
    spec:
      {{- with include "cohort-discovery.imagePullSecrets" . }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: postgres
          image: {{ include "cohort-discovery.image" .Values.images.postgres }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            {{- include "cohort-discovery.secretEnv" (dict "root" . "name" "POSTGRES_PASSWORD" "key" "synthetic-db-password") | nindent 12 }}
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "--username=postgres"]
            periodSeconds: 5
          resources:
            {{- toYaml .Values.synthetic.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $db }}-data
{{- range $collections }}
{{- $component := printf "bunny-%s" .slug }}
{{- $database := replace "-" "_" .slug }}
{{- $hostSecret := printf "bunny-%s" .host }}
{{- $slug := .slug }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cohort-discovery.name" (dict "root" $root "component" $component) }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "cohort-discovery.labels" (dict "root" $root "component" $component) | nindent 4 }}
    cohort-discovery.hdruk.ac.uk/bunny-host: {{ .host }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "cohort-discovery.selectorLabels" (dict "root" $root "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cohort-discovery.labels" (dict "root" $root "component" $component) | nindent 8 }}
    spec:
      {{- with include "cohort-discovery.imagePullSecrets" $root }}
      {{- . | nindent 6 }}
      {{- end }}
      initContainers:
        - name: create-database
          image: {{ include "cohort-discovery.image" $root.Values.images.postgres }}
          imagePullPolicy: {{ $root.Values.imagePullPolicy }}
          command:
            - sh
            - -c
            - |
              until pg_isready --quiet; do echo "Waiting for {{ $db }}..."; sleep 3; done
              psql --tuples-only --no-align --command="SELECT 1 FROM pg_database WHERE datname = '{{ $database }}'" | grep -q 1 \
                || createdb {{ $database }}
          env:
            - name: PGHOST
              value: {{ $db }}
            - name: PGUSER
              value: postgres
            {{- include "cohort-discovery.secretEnv" (dict "root" $root "name" "PGPASSWORD" "key" "synthetic-db-password") | nindent 12 }}
          resources:
            {{- toYaml $root.Values.waitResources | nindent 12 }}
        - name: load-synthetic-data
          image: {{ include "cohort-discovery.image" $root.Values.images.omopLite }}
          imagePullPolicy: {{ $root.Values.imagePullPolicy }}
          env:
            - name: DB_HOST
              value: {{ $db }}
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: postgres
            - name: DB_NAME
              value: {{ $database }}
            - name: SCHEMA_NAME
              value: omop
            - name: SYNTHETIC
              value: "true"
            - name: SYNTHETIC_NUMBER
              value: {{ .size | quote }}
            {{- include "cohort-discovery.secretEnv" (dict "root" $root "name" "DB_PASSWORD" "key" "synthetic-db-password") | nindent 12 }}
          resources:
            {{- toYaml $root.Values.synthetic.loadResources | nindent 12 }}
      containers:
        {{- range $taskType := list "a" "b" }}
        - name: bunny-{{ $taskType }}
          image: {{ include "cohort-discovery.image" $root.Values.images.bunny }}
          imagePullPolicy: {{ $root.Values.imagePullPolicy }}
          env:
            - name: TASK_API_TYPE
              value: {{ $taskType }}
            - name: DATASOURCE_DB_DRIVERNAME
              value: postgresql
            - name: DATASOURCE_DB_HOST
              value: {{ $db }}
            - name: DATASOURCE_DB_PORT
              value: "5432"
            - name: DATASOURCE_DB_USERNAME
              value: postgres
            - name: DATASOURCE_DB_DATABASE
              value: {{ $database }}
            - name: DATASOURCE_DB_SCHEMA
              value: omop
            {{- include "cohort-discovery.secretEnv" (dict "root" $root "name" "DATASOURCE_DB_PASSWORD" "key" "synthetic-db-password") | nindent 12 }}
            - name: TASK_API_ENFORCE_HTTPS
              value: "false"
            - name: POLLING_INTERVAL
              value: {{ $root.Values.synthetic.bunny.pollingInterval | quote }}
            - name: LOW_NUMBER_SUPPRESSION_THRESHOLD
              value: {{ $root.Values.synthetic.bunny.lowNumberSuppressionThreshold | quote }}
            - name: ROUNDING_TARGET
              value: {{ $root.Values.synthetic.bunny.roundingTarget | quote }}
            {{- range $name := list "TASK_API_BASE_URL" "TASK_API_USERNAME" "TASK_API_PASSWORD" }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $hostSecret }}
                  key: {{ $name }}
            {{- end }}
            - name: COLLECTION_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $hostSecret }}
                  key: collection-{{ $slug }}
          resources:
            {{- toYaml $root.Values.synthetic.bunnyResources | nindent 12 }}
        {{- end }}
{{- end }}
{{- end }}
