apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "cohort-discovery.name" (dict "root" . "component" "api-storage") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cohort-discovery.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.api.storageAccessMode }}
  {{- with .Values.api.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.api.storageSize }}
