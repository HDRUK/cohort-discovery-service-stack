{{- $name := include "cohort-discovery.name" (dict "root" . "component" "api") -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cohort-discovery.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  selector:
    {{- include "cohort-discovery.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cohort-discovery.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "cohort-discovery.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cohort-discovery.labels" (dict "root" . "component" "api") | nindent 8 }}
      annotations:
        checksum/api-env: {{ include (print $.Template.BasePath "/api-env.yaml") . | sha256sum }}
        checksum/api-config: {{ include "cohort-discovery.apiConfigFiles" . | sha256sum }}
    spec:
      {{- with include "cohort-discovery.podHostAliases" (dict "root" . "urls" (ternary (list (include "cohort-discovery.keycloakUrl" .)) list .Values.keycloak.enabled)) }}
      {{- . | nindent 6 }}
      {{- end }}
      initContainers:
        {{- include "cohort-discovery.waitForBootstrap" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "cohort-discovery.image" .Values.images.api }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "cohort-discovery.name" (dict "root" . "component" "api-env") }}
          env:
            - name: START_HORIZON
              value: "0"
            {{- include "cohort-discovery.apiSecretEnv" . | nindent 12 }}
          volumeMounts:
            - name: api-storage
              mountPath: /var/www/storage/app/private
            {{- if include "cohort-discovery.apiConfigFiles" . | fromJson }}
            {{- include "cohort-discovery.apiConfigMount" . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          startupProbe:
            httpGet:
              path: /up
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /up
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /up
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
        {{- if and .Values.keycloak.enabled (include "cohort-discovery.isLocalhost" (include "cohort-discovery.keycloakUrl" .)) }}
        {{- include "cohort-discovery.localhostForward" (dict "root" . "name" "keycloak-forward" "listenPort" (include "cohort-discovery.urlPort" (dict "url" (include "cohort-discovery.keycloakUrl" .))) "target" (printf "%s:%v" (include "cohort-discovery.name" (dict "root" . "component" "keycloak")) .Values.keycloak.port)) | nindent 8 }}
        {{- end }}
      volumes:
        - name: api-storage
          persistentVolumeClaim:
            claimName: {{ include "cohort-discovery.name" (dict "root" . "component" "api-storage") }}
        {{- if include "cohort-discovery.apiConfigFiles" . | fromJson }}
        {{- include "cohort-discovery.apiConfigVolume" . | nindent 8 }}
        {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cohort-discovery.name" (dict "root" . "component" "queue") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cohort-discovery.labels" (dict "root" . "component" "queue") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "cohort-discovery.selectorLabels" (dict "root" . "component" "queue") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cohort-discovery.labels" (dict "root" . "component" "queue") | nindent 8 }}
      annotations:
        checksum/api-env: {{ include (print $.Template.BasePath "/api-env.yaml") . | sha256sum }}
        checksum/api-config: {{ include "cohort-discovery.apiConfigFiles" . | sha256sum }}
    spec:
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "cohort-discovery.waitForBootstrap" . | nindent 8 }}
      containers:
        - name: horizon
          image: {{ include "cohort-discovery.image" .Values.images.api }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["php", "artisan", "horizon"]
          envFrom:
            - configMapRef:
                name: {{ include "cohort-discovery.name" (dict "root" . "component" "api-env") }}
          env:
            {{- include "cohort-discovery.apiSecretEnv" . | nindent 12 }}
          volumeMounts:
            - name: api-storage
              mountPath: /var/www/storage/app/private
            {{- if include "cohort-discovery.apiConfigFiles" . | fromJson }}
            {{- include "cohort-discovery.apiConfigMount" . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.queue.resources | nindent 12 }}
      volumes:
        - name: api-storage
          persistentVolumeClaim:
            claimName: {{ include "cohort-discovery.name" (dict "root" . "component" "api-storage") }}
        {{- if include "cohort-discovery.apiConfigFiles" . | fromJson }}
        {{- include "cohort-discovery.apiConfigVolume" . | nindent 8 }}
        {{- end }}
