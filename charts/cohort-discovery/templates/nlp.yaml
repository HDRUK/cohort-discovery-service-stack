{{- $name := include "cohort-discovery.name" (dict "root" . "component" "nlp") -}}
{{- $hasNlpConfig := or .Values.nlp.rulesJson .Values.nlp.mappingsJson -}}
{{- if $hasNlpConfig }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cohort-discovery.labels" (dict "root" . "component" "nlp") | nindent 4 }}
data:
  {{- with .Values.nlp.rulesJson }}
  rules.json: |
    {{- . | nindent 4 }}
  {{- end }}
  {{- with .Values.nlp.mappingsJson }}
  mappings.json: |
    {{- . | nindent 4 }}
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cohort-discovery.labels" (dict "root" . "component" "nlp") | nindent 4 }}
spec:
  selector:
    {{- include "cohort-discovery.selectorLabels" (dict "root" . "component" "nlp") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.nlp.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cohort-discovery.labels" (dict "root" . "component" "nlp") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "cohort-discovery.selectorLabels" (dict "root" . "component" "nlp") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cohort-discovery.labels" (dict "root" . "component" "nlp") | nindent 8 }}
      annotations:
        checksum/nlp-config: {{ printf "%s%s" .Values.nlp.rulesJson .Values.nlp.mappingsJson | sha256sum }}
    spec:
      {{- with include "cohort-discovery.imagePullSecrets" . }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "cohort-discovery.waitForBootstrap" . | nindent 8 }}
      containers:
        - name: nlp
          image: {{ include "cohort-discovery.image" .Values.images.nlp }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: PORT
              value: {{ .Values.nlp.port | quote }}
            - name: APP_ENV
              value: {{ .Values.nlp.appEnv | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.nlp.logLevel | quote }}
            - name: DB_HOST
              value: {{ include "cohort-discovery.mysqlHost" . }}
            - name: DB_PORT
              value: {{ .Values.mysql.port | quote }}
            - name: DB_NAME
              value: {{ .Values.mysql.appDatabase | quote }}
            - name: OMOP_DB_NAME
              value: {{ .Values.mysql.omopDatabase | quote }}
            - name: DB_USER
              value: {{ .Values.mysql.username | quote }}
            {{- include "cohort-discovery.secretEnv" (dict "root" . "name" "DB_PASS" "key" "mysql-password") | nindent 12 }}
            {{- if .Values.nlp.rulesJson }}
            - name: RULES_PATH
              value: /config/nlp/rules.json
            {{- end }}
            {{- if .Values.nlp.mappingsJson }}
            - name: MAPPINGS_PATH
              value: /config/nlp/mappings.json
            {{- end }}
            {{- range $key, $value := .Values.nlp.extraEnv }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.nlp.port }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.nlp.resources | nindent 12 }}
          {{- if $hasNlpConfig }}
          volumeMounts:
            - name: config
              mountPath: /config/nlp
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ $name }}-config
          {{- end }}
