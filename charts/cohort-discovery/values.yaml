imagePullPolicy: IfNotPresent

images:
  api:
    repository: ghcr.io/hdruk/cohort-discovery-api
    tag: b257363
  nlp:
    repository: ghcr.io/hdruk/cohort-discovery-nlp
    tag: v1.9.1
  web:
    repository: ghcr.io/hdruk/cohort-discovery-web
    tag: v1.12.0
  mysql:
    repository: mysql
    tag: 8.4.11
  redis:
    repository: redis
    tag: 7.2.13
  curl:
    repository: curlimages/curl
    tag: 8.23.0
  keycloak:
    repository: quay.io/keycloak/keycloak
    tag: 26.8.2
  socat:
    repository: alpine/socat
    tag: 1.8.1.3
  python:
    repository: python
    tag: 3.13.17-alpine3.24

mysql:
  appDatabase: cohort_discovery
  omopDatabase: omop
  username: cohort_discovery
  storageSize: 10Gi
  storageClassName: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi

redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

api:
  port: 8100
  appUrl: http://localhost:8100
  appEnv: production
  logLevel: info
  standaloneJwtTtlMinutes: 120
  authPhp: ""
  claimsAccessControlPhp: ""
  workgroupsPhp: ""
  extraEnv: {}
  resources:
    requests:
      cpu: 250m
      memory: 512Mi

queue:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

nlp:
  port: 5001
  appEnv: production
  logLevel: INFO
  rulesJson: ""
  mappingsJson: ""
  extraEnv: {}
  resources:
    requests:
      cpu: 250m
      memory: 512Mi

web:
  port: 3000
  appUrl: http://localhost:3000
  cookieTokenName: cds_stack_token
  extraEnv: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

keycloak:
  enabled: true
  port: 8180
  realmJson: ""
  themeFiles: {}
  roles:
    - researcher
    - platform-admin
    - data-custodian
  groups:
    - default
    - ukri
    - ncs
    - breathe
    - astrazeneca
    - gsk
    - bbmri
    - nhs-wales
    - Demo Custodian
  defaultGroup: default
  users:
    - email: admin@example.com
      firstName: Demo
      lastName: Admin
      groups:
        - Demo Custodian
      realmRoles:
        - platform-admin
      passwordKey: adminPassword
    - email: researcher@example.com
      firstName: Jane
      lastName: Doe
      groups:
        - breathe
      realmRoles:
        - researcher
      passwordKey: researcherPassword
    - email: custodian@example.com
      firstName: John
      lastName: Smith
      groups:
        - Demo Custodian
      realmRoles:
        - data-custodian
      passwordKey: custodianPassword
  storageSize: 1Gi
  storageClassName: ""
  resources:
    requests:
      cpu: 250m
      memory: 768Mi

socat:
  resources:
    requests:
      cpu: 10m
      memory: 16Mi

bootstrap:
  adminEmail: admin@example.com
  custodianName: Demo Custodian

provision:
  enabled: true
  json: ""

scheduler:
  enabled: true
  serviceAccountName: scheduler
  timeZone: Etc/UTC
  jobs:
    distributions-collector: "* * * * *"
    task-cleanup-job: "* * * * *"
    collection-no-activity-monitor: "* * * * *"
    collection-task-backlog-monitor: "* * * * *"

secrets: {}
