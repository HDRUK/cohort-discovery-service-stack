imagePullPolicy: IfNotPresent

hostAliases: []

waitResources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi

images:
  api:
    repository: ghcr.io/hdruk/cohort-discovery-api
    tag: b257363
  nlp:
    repository: ghcr.io/hdruk/cohort-discovery-nlp
    tag: v1.9.1
  web:
    repository: ghcr.io/hdruk/cohort-discovery-web
    tag: v1.12.0
  mysql:
    repository: mysql
    tag: 8.4.11
  redis:
    repository: redis
    tag: 7.2.13
  curl:
    repository: curlimages/curl
    tag: 8.23.0
  keycloak:
    repository: quay.io/keycloak/keycloak
    tag: 26.8.2
  socat:
    repository: alpine/socat
    tag: 1.8.1.3
  python:
    repository: python
    tag: 3.13.17-alpine3.24
  postgres:
    repository: postgres
    tag: "16.14"
  omopLite:
    repository: ghcr.io/health-informatics-uon/omop-lite
    tag: 0.9.3
  bunny:
    repository: ghcr.io/health-informatics-uon/hutch/bunny
    tag: 1.9.8

mysql:
  enabled: true
  host: ""
  port: 3306
  appDatabase: cohort_discovery
  omopDatabase: omop
  username: cohort_discovery
  storageSize: 10Gi
  storageClassName: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi

redis:
  enabled: true
  host: ""
  port: 6379
  auth: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

api:
  port: 8100
  appUrl: http://localhost:8100
  appEnv: production
  logLevel: info
  standaloneJwtTtlMinutes: 120
  authPhp: ""
  claimsAccessControlPhp: ""
  workgroupsPhp: ""
  extraEnv: {}
  storageSize: 5Gi
  storageClassName: ""
  storageAccessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1536Mi

queue:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

nlp:
  port: 5001
  appEnv: production
  logLevel: INFO
  rulesJson: ""
  mappingsJson: ""
  extraEnv: {}
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi

web:
  port: 3000
  appUrl: http://localhost:3000
  cookieTokenName: cds_stack_token
  extraEnv: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi

keycloak:
  enabled: true
  port: 8180
  url: ""
  realmJson: ""
  themeFiles: {}
  roles:
    - researcher
    - platform-admin
    - data-custodian
  groups:
    - default
    - ukri
    - ncs
    - breathe
    - astrazeneca
    - gsk
    - bbmri
    - nhs-wales
    - Demo Custodian
  defaultGroup: default
  users:
    - email: admin@example.com
      firstName: Demo
      lastName: Admin
      groups:
        - Demo Custodian
      realmRoles:
        - platform-admin
      passwordKey: adminPassword
    - email: researcher@example.com
      firstName: Jane
      lastName: Doe
      groups:
        - breathe
      realmRoles:
        - researcher
      passwordKey: researcherPassword
    - email: custodian@example.com
      firstName: John
      lastName: Smith
      groups:
        - Demo Custodian
      realmRoles:
        - data-custodian
      passwordKey: custodianPassword
  storageSize: 1Gi
  storageClassName: ""
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      memory: 1536Mi

sso:
  issuer: ""
  clientId: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  tls: []

init:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

socat:
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 32Mi

bootstrap:
  adminEmail: admin@example.com
  custodianName: Demo Custodian

provision:
  enabled: true
  json: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

vocab:
  athena:
    hostPath: ""
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 4Gi

synthetic:
  enabled: true
  defaultSize: 100
  storageSize: 5Gi
  storageClassName: ""
  bunny:
    pollingInterval: 5
    lowNumberSuppressionThreshold: 10
    roundingTarget: 10
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  bunnyResources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
  loadResources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

scheduler:
  enabled: true
  serviceAccountName: scheduler
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi
  timeZone: Etc/UTC
  jobs:
    distributions-collector: "* * * * *"
    task-cleanup-job: "* * * * *"
    collection-no-activity-monitor: "* * * * *"
    collection-task-backlog-monitor: "* * * * *"

secrets: {}
